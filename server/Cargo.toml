[package]
name = "kvm-server"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "kvm-server"
path = "src/main.rs"

[lib]
name = "kvm_server"
path = "src/lib.rs"

[dependencies]
kvm-common = { path = "../common" }

# Async runtime
tokio = { workspace = true }

# TLS
rustls = { workspace = true }
rustls-pemfile = { workspace = true }
tokio-rustls = { workspace = true }
rcgen = "0.12"

# mDNS
mdns-sd = { workspace = true }

# Clipboard
arboard = { workspace = true }

# Serialization
serde = { workspace = true }
toml = { workspace = true }
bincode = { workspace = true }
uuid = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Error handling
anyhow = { workspace = true }

# Hashing
sha2 = { workspace = true }

# Cross-platform
dirs = { workspace = true }

# Random PIN generation
rand = "0.8"

# CLI
clap = { version = "4.4", features = ["derive"] }

# Hostname
hostname = "0.3"

# Date/time
chrono = { workspace = true }

# Input capture/injection. `unstable_grab` lets us block local input while
# forwarding is on (Windows/macOS only - see server/src/capture.rs); on
# Linux we fall back to `rdev::listen`, which cannot block anything.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
rdev = { workspace = true, features = ["unstable_grab"] }
[target.'cfg(not(any(windows, target_os = "macos")))'.dependencies]
rdev = { workspace = true }
