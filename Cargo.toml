[workspace]
members = ["common", "server", "client", "ui"]
resolver = "2"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["KVM-RS Contributors"]
license = "MIT"

[workspace.dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
uuid = { version = "1.6", features = ["serde", "v4"] }

# Async runtime
tokio = { version = "1.35", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }

# Networking & TLS
rustls = "0.22"
rustls-pemfile = "2.0"
tokio-rustls = "0.25"

# mDNS discovery
mdns-sd = "0.10"

# Input capture/injection
rdev = "0.5"
enigo = "0.2"

# Clipboard
arboard = "3.3"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Configuration
serde_json = "1.0"
toml = "0.8"

# Hashing
sha2 = "0.10"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Cross-platform paths
dirs = "5.0"
