name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build_and_test:
    name: Build and Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Cache cargo registry and build artifacts
      uses: Swatinem/rust-cache@v2

    - name: Install Linux dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libx11-dev libxi-dev libxtst-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libudev-dev

    - name: Check formatting
      run: cargo fmt --all --check

    - name: Clippy
      run: cargo clippy --workspace --exclude ui --all-targets -- -D warnings

    - name: Run Tests
      run: cargo test --workspace --exclude ui

    - name: Build Release
      run: cargo build --release -p kvm-server -p kvm-client

  ui-check:
    name: UI Check on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Tauri v1's wry/webkit2gtk bindings are built against the webkit2gtk-4.0 /
        # libsoup2 ABI, whose -dev packages were dropped from Ubuntu 24.04 (ubuntu-latest).
        # Pin to 22.04 (which still ships libwebkit2gtk-4.0-dev etc.) rather than installing
        # the 4.1/libsoup3 packages, which are a different, incompatible ABI for Tauri v1.
        os: [ubuntu-22.04, windows-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Cache cargo registry and build artifacts
      uses: Swatinem/rust-cache@v2

    - name: Install Linux Tauri dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.0-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup2.4-dev libjavascriptcoregtk-4.0-dev

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install UI dependencies
      working-directory: ui
      run: npm ci

    - name: Build UI frontend
      working-directory: ui
      run: npm run build

    - name: Cargo check (ui)
      run: cargo check -p ui

    - name: Clippy (ui)
      run: cargo clippy -p ui -- -D warnings
